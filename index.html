<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lumo Hub - Your travel companion PWA">

  <!-- PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chameleon_customer_hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>chameleon_customer_hub</title>

  <script>
    // Will be injected by Flutter build
    const serviceWorkerVersion = "1206807160";
  </script>

  <!-- Flutter engine -->
  <script src="flutter.js" defer></script>

  <!-- PWA install logic -->
  <script src="pwa_install.js" defer></script>
</head>
<body>
<script>
  window.addEventListener('load', function() {
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/flutter_service_worker.js');
    }

    // Start Flutter app
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
